<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT - Sign in</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            background:
                radial-gradient(circle at 88% 4%, rgba(255,255,255,0.5) 0, rgba(255,255,255,0) 9%),
                radial-gradient(circle at 97% 88%, rgba(56,189,248,0.95) 0, rgba(56,189,248,0) 42%),
                radial-gradient(circle at 0% 108%, rgba(236,72,153,0.9) 0, rgba(236,72,153,0) 46%),
                linear-gradient(120deg, #8b2fc9 0%, #a934e0 30%, #c445ec 58%, #8f5cf7 100%);
            overflow-x: hidden;
        }

        .page {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: clamp(1.25rem, 3vw, 2.75rem) clamp(1.5rem, 6vw, 5.5rem);
        }

        /* decorative blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        .blob-1 {
            top: -22%;
            right: -8%;
            width: 34vw;
            height: 34vw;
            background: rgba(255, 255, 255, 0.14);
        }
        .blob-2 {
            bottom: -34%;
            left: -12%;
            width: 52vw;
            height: 52vw;
            background: rgba(255, 255, 255, 0.10);
        }

        /* ── logo ──────────────────────────────────────────── */
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.01em;
            z-index: 2;
        }
        .brand-logo svg { width: 36px; height: 36px; }

        /* ── main row ──────────────────────────────────────── */
        .main-row {
            flex: 1;
            display: flex;
            align-items: center;
            gap: clamp(2rem, 5vw, 5rem);
            z-index: 1;
            padding-top: clamp(1rem, 3vh, 2rem);
        }

        .brand-content { flex: 1 1 55%; max-width: 560px; }
        .brand-title {
            font-size: clamp(2.2rem, 4vw, 3.4rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 1.1rem;
        }
        .brand-sub {
            font-size: clamp(1rem, 1.3vw, 1.2rem);
            line-height: 1.55;
            color: rgba(255, 255, 255, 0.92);
            max-width: 24rem;
            margin-bottom: clamp(1.8rem, 4vh, 3.2rem);
        }
        .feature-list {
            display: flex;
            flex-direction: column;
            gap: clamp(1.1rem, 2.6vh, 1.9rem);
            list-style: none;
        }
        .feature-list li { display: flex; align-items: center; gap: 1.1rem; }
        .feature-icon {
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(4px);
        }
        .feature-icon svg { width: 23px; height: 23px; }
        .feature-text strong { display: block; font-size: 1.08rem; font-weight: 700; }
        .feature-text span { font-size: 0.9rem; color: rgba(255, 255, 255, 0.85); }

        /* ── login card (floats on the gradient, right side) ── */
        .login-card {
            flex: 0 1 430px;
            background: #ffffff;
            color: #18181b;
            width: 100%;
            max-width: 430px;
            border-radius: 20px;
            padding: clamp(1.9rem, 3vw, 2.6rem);
            box-shadow: 0 24px 60px rgba(43, 8, 79, 0.35);
        }
        .login-title { font-size: 1.65rem; font-weight: 800; color: #18181b; margin-bottom: 0.4rem; letter-spacing: -0.01em; }
        .login-subtitle { font-size: 0.93rem; color: #71717a; margin-bottom: 1.7rem; }

        .form-group { margin-bottom: 1.15rem; }
        .form-group label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            color: #3f3f46;
            margin-bottom: 0.45rem;
        }
        .input-wrap { position: relative; }
        .input-wrap .lead-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            width: 17px; height: 17px;
            color: #a1a1aa;
            pointer-events: none;
        }
        .input-wrap input {
            width: 100%;
            padding: 0.78rem 2.7rem 0.78rem 2.6rem;
            font: inherit;
            font-size: 0.95rem;
            color: #18181b;
            background: #ffffff;
            border: 1px solid #e4e4e7;
            border-radius: 11px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .input-wrap input::placeholder { color: #b6b6bf; }
        .input-wrap input:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.16);
        }
        .eye-btn {
            position: absolute;
            right: 0.55rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px; height: 34px;
            border: none;
            background: none;
            color: #a1a1aa;
            border-radius: 8px;
            cursor: pointer;
        }
        .eye-btn:hover { color: #52525b; }
        .eye-btn svg { width: 19px; height: 19px; }

        .btn-signin {
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.85rem 1rem;
            font: inherit;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(90deg, #7c3aed, #d946ef);
            transition: filter 0.15s, transform 0.05s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-signin:hover { filter: brightness(1.08); }
        .btn-signin:active { transform: translateY(1px); }
        .btn-signin:disabled { opacity: 0.65; cursor: not-allowed; }
        .btn-loader.hidden { display: none; }
        .btn-loader {
            width: 17px; height: 17px;
            margin-left: 0.6rem;
            border: 2px solid rgba(255,255,255,0.45);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .row-between {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1rem;
            font-size: 0.87rem;
        }
        .remember { display: flex; align-items: center; gap: 0.5rem; color: #52525b; cursor: pointer; }
        .remember input { width: 15px; height: 15px; accent-color: #7c3aed; cursor: pointer; }
        .forgot { color: #7c3aed; font-weight: 600; text-decoration: none; }
        .forgot:hover { text-decoration: underline; }

        .login-footer { margin-top: 1.6rem; text-align: center; font-size: 0.89rem; color: #71717a; }
        .login-footer a { color: #7c3aed; font-weight: 700; text-decoration: none; }
        .login-footer a:hover { text-decoration: underline; }

        .error-box {
            margin-top: 1rem;
            padding: 0.7rem 0.9rem;
            font-size: 0.86rem;
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
        }
        .error-box.hidden { display: none; }

        @media (max-width: 900px) {
            .main-row { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 2rem; }
            .brand-content { max-width: none; }
            .login-card { flex: none; max-width: none; margin: 0 auto 1rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            .btn-signin, input { transition: none; }
        }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js');
        });
      }
    </script>
</head>
<body>
    <div class="page">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>

        <!-- ── logo ─────────────────────────────────────── -->
        <div class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
            </svg>
            <span>CBT</span>
        </div>

        <div class="main-row">
            <!-- ── left: brand ──────────────────────────── -->
            <div class="brand-content">
                <h1 class="brand-title">Learn Today,<br>Build Tomorrow</h1>
                <p class="brand-sub">Your online assessment platform for a better future.</p>
                <ul class="feature-list">
                    <li>
                        <span class="feature-icon">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2z"/></svg>
                        </span>
                        <span class="feature-text"><strong>Take Tests</strong><span>Practice anytime, anywhere</span></span>
                    </li>
                    <li>
                        <span class="feature-icon">
                            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="12" width="3.4" height="8" rx="1"/><rect x="10.3" y="7" width="3.4" height="13" rx="1"/><rect x="16.6" y="3" width="3.4" height="17" rx="1"/></svg>
                        </span>
                        <span class="feature-text"><strong>Track Progress</strong><span>Monitor your performance</span></span>
                    </li>
                    <li>
                        <span class="feature-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4L12 17.6l-5.8 3 1.1-6.4L2.6 9.6l6.5-.9L12 2.8z"/></svg>
                        </span>
                        <span class="feature-text"><strong>Achieve More</strong><span>Build your dream career</span></span>
                    </li>
                </ul>
            </div>

            <!-- ── right: sign-in card ──────────────────── -->
            <div class="login-card">
                <h2 class="login-title">Welcome back</h2>
                <p class="login-subtitle">Sign in to your account to continue</p>

                <form id="loginForm" class="login-form" novalidate>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-wrap">
                            <svg class="lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
                            <input type="email" id="email" placeholder="admin@example.com" autocomplete="username" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrap">
                            <svg class="lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4.5" y="10" width="15" height="10" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/></svg>
                            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                            <button type="button" class="eye-btn" id="togglePassword" aria-label="Show password">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-signin" id="loginBtn">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-loader hidden"></span>
                    </button>
                </form>

                <div id="errorBox" class="error-box hidden"></div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
    <script>
        // Password visibility toggle
        const pwd = document.getElementById('password');
        document.getElementById('togglePassword').addEventListener('click', () => {
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
        });
    </script>
</body>
</html>
