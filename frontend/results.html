<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QForge - Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.min.js"></script>
    <style>
        .results-container {
            max-width: 900px;
            margin: 3rem auto;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .score-card {
            display: flex;
            justify-content: space-around;
            text-align: center;
            background-color: var(--bg-input);
            border-radius: var(--radius-md);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .score-stat h3 {
            font-size: 2.5rem;
            margin: 0;
            color: var(--primary);
        }

        .score-stat p {
            color: var(--text-secondary);
            margin-top: 0.5rem;
            font-weight: 500;
        }

        .score-stat.correct h3 { color: var(--success); }
        .score-stat.wrong h3 { color: var(--danger); }
        
        .answer-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .answer-item {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 1.5rem;
        }

        .answer-item.correct { border-left: 4px solid var(--success); }
        .answer-item.wrong { border-left: 4px solid var(--danger); }
        .answer-item.unattempted { border-left: 4px solid var(--text-muted); }

        .answer-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .explanation {
            margin-top: 1rem;
            padding: 1rem;
            background-color: rgba(59, 130, 246, 0.05);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
    </style>
<link href='https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700&display=swap' rel='stylesheet'>
</head>
<body>
    <div class="results-container">
        <div class="nav-header">
            <h1 id="examTitle">Exam Results</h1>
            <button class="btn-primary" style="margin:0; width:auto; padding:0.5rem 1rem;" onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
        </div>

        <div id="loadingIndicator" style="text-align:center; padding: 2rem;">Loading your results...</div>
        
        <div id="resultsContent" style="display:none;">
            <div class="score-card">
                <div class="score-stat">
                    <h3 id="totalScore">0</h3>
                    <p>Total Score</p>
                </div>
                <div class="score-stat correct">
                    <h3 id="totalCorrect">0</h3>
                    <p>Correct</p>
                </div>
                <div class="score-stat wrong">
                    <h3 id="totalWrong">0</h3>
                    <p>Wrong</p>
                </div>
                <div class="score-stat">
                    <h3 id="totalUnattempted">0</h3>
                    <p>Unattempted</p>
                </div>
            </div>

            <h2>Detailed Breakdown</h2>
            <div id="answerList" class="answer-list">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/results.js"></script>
</body>
</html>
